name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # build.cmd uses the C# compiler that ships with .NET Framework 4 (part of Windows):
      - name: Build GaGa.exe
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: GaGa-Windows
          path: Build/GaGa.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # universal (Apple silicon + Intel) app, packaged as .dmg and .zip:
      - name: Build GaGa.app
        working-directory: macOS
        run: ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GaGa-macOS
          path: |
            macOS/build/*.dmg
            macOS/build/*.zip
