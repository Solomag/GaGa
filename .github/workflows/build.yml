name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # build.cmd uses the C# compiler that ships with .NET Framework 4 (part of Windows):
      - name: Build GaGa.exe
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: GaGa
          path: Build/GaGa.exe
